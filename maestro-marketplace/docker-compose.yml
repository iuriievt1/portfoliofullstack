version: "3.9"

services:
  app:
    build: .
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/maestro?schema=public
      AUTH_SECRET: maestro-local-secret
      APP_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
      DEFAULT_CURRENCY: USD
      DEFAULT_LOCALE: en-US
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maestro
    ports:
      - "5432:5432"
    volumes:
      - maestro-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  maestro-postgres:
