version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: otpbank-postgres
    environment:
      POSTGRES_DB: otpbank
      POSTGRES_USER: otpbank
      POSTGRES_PASSWORD: otpbank
    ports:
      - "5432:5432"
    volumes:
      - otpbank_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otpbank -d otpbank"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: otpbank-redis
    ports:
      - "6379:6379"
    volumes:
      - otpbank_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    container_name: otpbank-api
    working_dir: /workspace
    command: sh -lc "corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install && pnpm --filter @otpbank/api prisma:generate && pnpm --filter @otpbank/api prisma:migrate deploy && pnpm --filter @otpbank/api dev"
    env_file:
      - .env.example
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    container_name: otpbank-web
    working_dir: /workspace
    command: sh -lc "corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install && pnpm --filter @otpbank/web dev"
    env_file:
      - .env.example
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
    depends_on:
      - api

  worker:
    image: node:22-alpine
    container_name: otpbank-worker
    working_dir: /workspace
    command: sh -lc "corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install && pnpm --filter @otpbank/worker dev"
    env_file:
      - .env.example
    volumes:
      - .:/workspace
    depends_on:
      - api
      - redis

volumes:
  otpbank_postgres:
  otpbank_redis:
