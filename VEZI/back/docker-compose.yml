services:
  postgres:
    image: postgres:16
    container_name: vezi_postgres
    environment:
      POSTGRES_USER: vezi
      POSTGRES_PASSWORD: vezi_password
      POSTGRES_DB: vezi
    ports:
      - "5432:5432"
    volumes:
      - vezi_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: vezi_redis
    ports:
      - "6379:6379"

volumes:
  vezi_pg:
